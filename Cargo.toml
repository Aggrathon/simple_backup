[package]
name = "simple_backup"
version = "2.2.2"
authors = ["Aggrathon <antonbjo@gmail.com>"]
edition = "2024"
description = "A minimal application for doing backups."
readme = "README.md"
keywords = ["backup", "compression", "application", "software"]

[dependencies]
tar = "0.4.46"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
chrono = "0.4.45"
regex = "1.13.1"
path-clean = "1.0.1"
path-absolutize = "4.0.1"
indicatif = { version = "0.18.6", features = ["improved_unicode"] }
zstd = { version = "0.13.3", features = ["zstdmt"] }
iced = { version = "0.14.0", features = ["smol"], optional = true }
rfd = { version = "0.17.2", optional = true }
dirs = { version = "6.0.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
resvg = "0.48.1"
usvg = { version = "0.48.1", features = ["text"] }
tiny-skia = "0.12.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.19"
ico = "0.3.0"

[features]
default = ["gui", "dirs"]
gui = ["iced", "rfd"]
